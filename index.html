<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wahrnehmungslabor – Physik 8</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182638;background:#edf3fa}*{box-sizing:border-box}body{margin:0}header{background:#142c4a;color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}h1{margin:0;font-size:clamp(26px,4vw,40px)}h2{margin:0 0 12px}p{line-height:1.55}.sub{color:#c7d7eb}main{max-width:1000px;margin:auto;padding:20px}.panel{background:white;border:1px solid #d8e1ed;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 14px #12243b0b}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{flex:1;min-width:115px}.nav button.active{background:#1b65b9;color:white}button{cursor:pointer;border:1px solid #b8cadc;background:#f1f6fb;color:#173454;padding:11px 15px;border-radius:10px;font-weight:700}button:hover{filter:brightness(.96)}button.primary{background:#1463b9;color:white;border-color:#1463b9}button:disabled{opacity:.5;cursor:not-allowed}label{display:block;font-weight:700;margin:14px 0 6px}input[type=text],textarea,select{width:100%;padding:11px;border:1px solid #aabbd0;border-radius:9px;font:inherit}textarea{min-height:95px;resize:vertical}input[type=range]{width:100%}.muted{color:#52667c}.hint{background:#eaf4ff;border-left:4px solid #3985d2;padding:12px;border-radius:7px;margin:12px 0}.warning{background:#fff4df;border-left:4px solid #e3a131;padding:12px;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.illusion{background:#f8fbff;border:1px solid #d9e5f3;border-radius:12px;min-height:225px;display:grid;place-items:center;padding:15px}.illusion svg{max-width:100%;height:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.tag{display:inline-block;background:#dceafa;color:#15477b;padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}.hidden{display:none!important}.check{display:flex;align-items:start;gap:10px;margin:10px 0;font-weight:400}.check input{margin-top:5px}.q{border:1px solid #d8e3ef;border-radius:12px;padding:15px;margin:12px 0}.q label{font-weight:400;margin:9px 0}.meter{height:10px;background:#dce7f3;border-radius:10px;overflow:hidden}.meter>div{height:100%;background:#2b79c6;transition:width .2s}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.footer{color:#566a7d;text-align:center;padding:20px}.results{font-size:18px}.small{font-size:13px}.reveal{border:1px dashed #9bb5d1;border-radius:12px;padding:13px;margin-top:12px}.timer{font-variant-numeric:tabular-nums;font-weight:800} @media print{header,.nav,.actions,.no-print,button{display:none!important}body{background:white}.panel{box-shadow:none;border:0}main{max-width:none}textarea{border:0;min-height:auto}}
</style></head><body><header><div class="toprow"><div><div class="tag">PHYSIK · KLASSE 8</div><h1>Das Wahrnehmungslabor 👁️</h1><p class="sub">Mission: Kannst du deinen Augen trauen?</p></div><div class="timer" id="clock">⏱ 00:00</div></div></header><main><div class="panel"><div class="toprow"><strong id="stepName">Start</strong><span id="progressText">0 von 7 Etappen</span></div><div class="meter"><div id="bar" style="width:0%"></div></div><div class="nav" id="nav"></div></div><section id="content" class="panel"></section><div class="actions"><button id="prev">← Zurück</button><button class="primary" id="next">Weiter →</button></div><div class="footer">Alle Eingaben werden nur auf diesem Gerät im Browser gespeichert. Ohne Server wird nichts automatisch an die Lehrkraft gesendet.</div></main><script>
const stages=['Start','1 · Beobachten','2 · Kreise','3 · Perspektive','4 · Vase','5 · Transfer','6 · Abschluss','7 · Abgabe'];let step=0;let data={};try{data=JSON.parse(localStorage.getItem('wahrnehmungslabor_v2')||'{}')}catch(e){};const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('wahrnehmungslabor_v2',JSON.stringify(data))}catch(e){}};function field(id,title,placeholder='',rows=3){return `<label for="${id}">${title}</label><textarea id="${id}" data-field="${id}" rows="${rows}" placeholder="${safe(placeholder)}">${safe(data[id]||'')}</textarea>`}function inp(id,title,placeholder=''){return `<label for="${id}">${title}</label><input type="text" id="${id}" data-field="${id}" placeholder="${safe(placeholder)}" value="${safe(data[id]||'')}">`}
function circles(){let s='<svg viewBox="0 0 560 230" role="img" aria-label="Zwei orange Mittelpunkte mit verschieden großen grauen Umgebungskreisen">';for(let [cx,r,n,rad] of [[140,31,8,57],[420,12,8,57]]){for(let i=0;i<n;i++){let a=2*Math.PI*i/n;s+=`<circle cx="${cx+rad*Math.cos(a)}" cy="${112+rad*Math.sin(a)}" r="${r}" fill="#8da2bb"/>`}s+=`<circle cx="${cx}" cy="112" r="23" fill="#ed8841" stroke="#a8501d" stroke-width="2"/>`}return s+'</svg>'}function ponzo(){return `<svg viewBox="0 0 560 250" role="img" aria-label="Zwei gleich lange horizontale Linien zwischen zusammenlaufenden Schienen"><path d="M120 235 L260 15 M440 235 L300 15" stroke="#7189a4" stroke-width="6"/><path d="M210 80 H350 M210 195 H350" stroke="#ed8841" stroke-width="8" stroke-linecap="round"/><text x="280" y="245" text-anchor="middle" fill="#54677b" font-size="13">Beide orangefarbenen Strecken sind 140 Einheiten lang</text></svg>`}function vase(){return `<svg viewBox="0 0 360 260" role="img" aria-label="Rubin-Vase: schwarze Gesichtsprofile und weiße Vase"><rect x="25" y="8" width="310" height="244" rx="8" fill="#152b44"/><path d="M144 8 L144 42 Q146 58 132 69 Q120 80 130 91 Q148 101 134 112 Q116 125 136 135 Q146 148 132 163 Q113 181 127 201 Q140 220 145 252 L215 252 Q220 220 233 201 Q247 181 228 163 Q214 148 224 135 Q244 125 226 112 Q212 101 230 91 Q240 80 228 69 Q214 58 216 42 L216 8 Z" fill="white"/></svg>`}function lines(){return `<svg viewBox="0 0 560 220" role="img" aria-label="Müller-Lyer-Täuschung: gleich lange waagerechte Linien mit unterschiedlichen Pfeilenden"><g stroke="#152b44" stroke-width="5" fill="none"><path d="M150 60 H410 M150 60 l-35 -28 M150 60 l-35 28 M410 60 l35 -28 M410 60 l35 28"/><path d="M150 160 H410 M150 160 l35 -28 M150 160 l35 28 M410 160 l-35 -28 M410 160 l-35 28"/></g></svg>`}function experiment(s){return `<div class="hint"><strong>Forschungsregel:</strong> Erst selbst beobachten und vermuten, dann überprüfen. Eine gute Hypothese muss überprüfbar sein.</div>${s}`};const tasks={2:['Kreise','Vergleicht die beiden orangefarbenen Kreise.',circles(),'Tipp: Betrachtet erst beide Bilder gleichzeitig. Messt danach den Durchmesser der orangefarbenen Kreise mit einem Lineal am Bildschirm oder auf einem Ausdruck.'],3:['Perspektive','Welche orangefarbene Linie wirkt länger?',ponzo(),'Tipp: Verdeckt die schrägen Linien mit Papier. Vergleicht dann die orangefarbenen Strecken oder messt sie.'],4:['Vase oder Gesichter','Was erkennst du zuerst: eine Vase oder zwei Gesichter?',vase(),'Tipp: Schaut abwechselnd auf die weiße und die dunkle Fläche. Verdeckt probeweise Teile des Bildes.']};
function taskHTML(k){let [name,question,art,tip]=tasks[k];return `<span class="tag">Forschungsstation ${k-1} von 3 · ca. 10 Minuten</span><h2>${name}</h2><p>${question}</p><div class="illusion">${art}</div>${experiment(field('obs'+k,'1. Beobachtung: Was seht ihr? Sehen alle dasselbe?','Wir beobachten ...')+field('hyp'+k,'2. Hypothese: Warum entsteht der Eindruck?','Wir vermuten, dass ...')+field('test'+k,'3. Versuchsplan: Wie überprüft ihr eure Vermutung?','Wir könnten ...')+`<details class="reveal"><summary><strong>🔎 Experimentierhilfe anzeigen (erst nach eurer Vermutung!)</strong></summary><p>${tip}</p></details>`+field('result'+k,'4. Ergebnis: Was hat euer Versuch gezeigt?','Unsere Beobachtung beim Überprüfen ...')+field('limit'+k,'5. Was bleibt noch ungeklärt?','Wir können noch nicht erklären ...',2))}`}
const quiz=[['Welche Aussage passt am besten zu einer Hypothese?',['Eine überprüfbare Vermutung','Eine sichere Tatsache','Eine zufällige Antwort'],0],['Bei den Kreisen wirkt die Größe anders, weil ...',['die orange Farbe die Kreise verändert','die Umgebung unsere Wahrnehmung beeinflusst','die Kreise unterschiedlich groß sein müssen'],1],['Was zeigt der Versuch mit den Perspektivlinien?',['Die Linien werden beim Hinsehen länger','Unser Gehirn deutet den räumlichen Zusammenhang','Das Lineal ist unzuverlässig'],1],['Was ist an der Vase/Gesichter-Figur besonders?',['Das Bild verändert sich physikalisch','Es gibt nur eine richtige Sichtweise','Unser Gehirn kann Vordergrund und Hintergrund unterschiedlich zuordnen'],2],['Was unterscheidet einen toten Winkel von einer optischen Täuschung?',['Beim toten Winkel fehlen visuelle Informationen; bei Täuschungen werden vorhandene Informationen anders interpretiert','Es gibt keinen Unterschied','Bei optischen Täuschungen fehlen immer die Augen'],0]];
function quizHTML(){return quiz.map((q,i)=>`<div class="q"><strong>${i+1}. ${q[0]}</strong>${q[1].map((a,j)=>`<label class="check"><input type="radio" name="q${i}" value="${j}" ${data['q'+i]==j?'checked':''}>${a}</label>`).join('')}</div>`).join('')}
function score(){let q=quiz.reduce((n,item,i)=>n+(Number(data['q'+i])===item[2]?1:0),0);let full=[2,3,4].reduce((n,k)=>n+['obs','hyp','test','result'].reduce((m,p)=>m+(String(data[p+k]||'').trim().length>=25?1:0),0),0);let trans=['transfer','example','reflection'].reduce((n,k)=>n+(String(data[k]||'').trim().length>=35?1:0),0);return {q,full,trans,total:q+full+trans}}
function report(){let sc=score();let out=`WAHRNEHMUNGSLABOR – FORSCHUNGSBERICHT\n${'='.repeat(45)}\nTeam: ${data.team||'—'}\nKlasse: ${data.klasse||'—'}\nDatum: ${new Date().toLocaleDateString('de-DE')}\n\n`;for(let k of [2,3,4]){out+=`STATION: ${tasks[k][0]}\n`;for(let [key,name] of [['obs','Beobachtung'],['hyp','Hypothese'],['test','Versuchsplan'],['result','Ergebnis'],['limit','Offene Fragen']])out+=`${name}: ${data[key+k]||'—'}\n`;out+='\n'}for(let [key,name] of [['transfer','Unterschied zum toten Winkel'],['example','Alltagsbeispiel'],['reflection','Reflexion']])out+=`${name}: ${data[key]||'—'}\n`;out+='\nABSCHLUSSTEST\n';quiz.forEach((q,i)=>out+=`${i+1}. ${q[0]}\nAntwort: ${q[1][data['q'+i]]||'—'}\nRichtig: ${Number(data['q'+i])===q[2]?'ja':'nein'}\n`);out+=`\nAUTOMATISCHE VORBEWERTUNG (keine endgültige Note)\nQuiz: ${sc.q}/5\nDokumentation (Mindestlänge): ${sc.full}/12\nTransfer (Mindestlänge): ${sc.trans}/3\nGesamt: ${sc.total}/20\nHinweis: Die Textpunkte messen nur Vollständigkeit/Mindestlänge. Fachliche Qualität und Note bewertet die Lehrkraft.\n`;return out}
function download(){let b=new Blob([report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Forscherbericht_'+(data.team||'Team').replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){let html='';if(step===0)html=`<span class="tag">Mission · 60–65 Minuten</span><h2>Willkommen im Forschungsteam!</h2><p>Ihr untersucht, warum Augen und Gehirn uns manchmal etwas anderes zeigen als das, was sich messen lässt. Arbeitet in Gruppen von 3–4 Personen. <strong>Ihr braucht:</strong> ein Gerät, Papier, Stift und ein Lineal.</p>${inp('team','Teammitglieder (Vor- und Nachnamen)','Alle Teammitglieder')}${inp('klasse','Klasse','z. B. 8b')}<div class="hint">Eure Mission: Beobachten → Vermuten → Überprüfen → Erklären. Besprecht jede Antwort im Team, bevor ihr sie eintragt.</div><p>⏳ Zeitplan: Einstieg 5 Min. · drei Stationen je 10 Min. · Transfer 10 Min. · Quiz 10 Min. · Abgabe 5–10 Min.</p><p class="muted small">Die Uhr oben zählt eure Arbeitszeit. Der Fortschritt wird lokal gespeichert; nutzt für die Abgabe möglichst dasselbe Gerät.</p>`;
if(step===1)html=`<span class="tag">Einstieg · 5 Minuten</span><h2>Welche Linie ist länger?</h2><div class="illusion">${lines()}</div>${field('entry','Diskutiert: Welche Linie wirkt länger? Wie könnt ihr es herausfinden?','Unsere Vermutung ...')}<details class="reveal"><summary><strong>Auflösung nach eurer Diskussion</strong></summary><p>Die beiden waagerechten Linien sind gleich lang. Ihr könnt sie messen. Die Pfeilenden beeinflussen, wie lang die Linien wirken.</p></details>`;
if(tasks[step])html=taskHTML(step);
if(step===5)html=`<span class="tag">Transfer · 10 Minuten</span><h2>Was hat das mit dem toten Winkel zu tun?</h2><p>Beim Auto habt ihr untersucht, dass Menschen oder Gegenstände trotz Blick in die Spiegel unsichtbar bleiben können. Heute habt ihr erlebt, dass Sichtbares auch falsch gedeutet werden kann.</p>${field('transfer','1. Erklärt den Unterschied zwischen totem Winkel und optischer Täuschung.','Beim toten Winkel ... Bei einer optischen Täuschung ...')}${field('example','2. Denkt euch eine Alltagssituation aus, in der eine falsche Wahrnehmung gefährlich werden könnte. Begründet.','Eine Situation wäre ...')}${field('reflection','3. Welche eurer Hypothesen war am besten überprüfbar? Warum?','Unsere Hypothese ... war überprüfbar, weil ...')}<div class="hint">Merksatz: Augen nehmen Licht auf. Das Gehirn verarbeitet die Informationen und deutet sie anhand von Zusammenhängen und Erfahrungen.</div>`;
if(step===6)html=`<span class="tag">Wissenscheck · 10 Minuten</span><h2>Der Forscher-Check</h2><p>Entscheidet gemeinsam. Der Test zählt mit 5 Punkten zur automatischen Vorbewertung.</p>${quizHTML()}`;
if(step===7){let s=score();html=`<span class="tag">Abgabe · 5–10 Minuten</span><h2>Mission abgeschlossen!</h2><p>Kontrolliert eure Angaben und gebt euren Forschungsbericht ab.</p><div class="grid"><div class="hint results"><strong>${s.q}/5</strong><br>Quizpunkte</div><div class="hint results"><strong>${s.full+s.trans}/15</strong><br>Textfelder mit Mindestlänge</div><div class="hint results"><strong>${s.total}/20</strong><br>Automatische Vorbewertung</div></div><div class="warning"><strong>Wichtig für die Note:</strong> Die automatische Vorbewertung prüft beim Text nur, ob genügend geschrieben wurde – nicht, ob die Antworten richtig oder wissenschaftlich gut sind. Die Lehrkraft bewertet die Qualität und vergibt die endgültige Note.</div><h3>So gebt ihr ab</h3><p><strong>Variante A:</strong> Bericht herunterladen und der Lehrkraft als Datei zeigen oder über eure Schulplattform hochladen. <strong>Variante B:</strong> E-Mail-Programm öffnen und den Bericht als Text senden. Tragt die Adresse eurer Lehrkraft selbst ein.</p><div class="actions"><button class="primary" id="download">⬇ Forschungsbericht herunterladen</button><button id="mail">✉ Bericht per E-Mail vorbereiten</button><button id="print">🖨 Drucken</button></div><p class="muted small">Die E-Mail wird nicht automatisch versendet. Das E-Mail-Programm muss eingerichtet sein. Bei langen Berichten ist der Download zuverlässiger. Nutzt für personenbezogene Daten nur von eurer Schule erlaubte Übertragungswege.</p><details class="reveal"><summary>Forschungsbericht als Text ansehen</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere" id="preview">${safe(report())}</pre></details>`}
$('#content').innerHTML=html;$('#stepName').textContent=stages[step];$('#progressText').textContent=step+' von 7 Etappen';$('#bar').style.width=(step/7*100)+'%';$('#nav').innerHTML=stages.map((s,i)=>`<button data-go="${i}" class="${i===step?'active':''}">${s}</button>`).join('');$('#prev').disabled=step===0;$('#next').textContent=step===7?'Zurück zum Start ↺':'Weiter →';document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',e=>{data[e.target.dataset.field]=e.target.value;save()}));document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{data[e.target.name]=e.target.value;save()}));document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.go)));if(step===7){$('#download').onclick=download;$('#print').onclick=()=>window.print();$('#mail').onclick=()=>{let body=report();if(body.length>1400){alert('Der Bericht ist für einen E-Mail-Link möglicherweise zu lang. Lade ihn besser herunter und hänge die Datei an eine E-Mail an.');return}location.href='mailto:?subject='+encodeURIComponent('Physik Forscherbericht – '+(data.team||'Team'))+'&body='+encodeURIComponent(body)}}}
function go(i){step=Math.max(0,Math.min(7,i));render();window.scrollTo({top:0,behavior:'smooth'})}$('#prev').onclick=()=>go(step-1);$('#next').onclick=()=>go(step===7?0:step+1);let start=Date.now();setInterval(()=>{let t=Math.floor((Date.now()-start)/1000);$('#clock').textContent='⏱ '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);render();
</script></body></html>
